spring:
  application:
    name: interview-prep-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration


  jpa:
    hibernate:
      ddl-auto: validate         # Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_SECRET_EXPIRY_TIME}    # 24 hours in ms
  refresh-expiration: ${JWT_SECRET_REFRESH_TIME}  # 7 days

ai:
  openai:
    api-key: ${OPEN_AI_API_KEY}   # your github_p... token goes here
    base-url: ${OPEN_AI_API_URL}   # ← this changes
    model: ${OPEN_AI_API_MODEL}
    max-tokens: ${OPEN_AI_API_TOKENS}


judge0:
  api-url: ${JUDGE_O_API_URL}    # ← matches api-host
  api-host: ${JUDGE_O_API_HOST}
  api-key: ${JUDGE_O_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}