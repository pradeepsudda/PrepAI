spring:
  application:
    name: interview-prep-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/interview_prep
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration


  jpa:
    hibernate:
      ddl-auto: validate         # Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000     # 24 hours in ms
  refresh-expiration: 604800000  # 7 days

ai:
  openai:
    api-key: ${OPEN_AI_API_KEY}   # your github_p... token goes here
    base-url: https://models.inference.ai.azure.com   # ← this changes
    model: gpt-4.1-mini
    max-tokens: 2048


judge0:
    api-url:  https://judge029.p.rapidapi.com    # ← matches api-host
    api-host: judge029.p.rapidapi.com
    api-key: ${JUDGE_O_API_KEY}

cors:
  allowed-origins: http://localhost:5173